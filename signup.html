<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.box{
width:320px;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{
text-align:center;
}
input{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}
button{
width:100%;
padding:12px;
background:#2196F3;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}
button:hover{
background:#1976D2;
}
p{
text-align:center;
}
</style>
</head>
<body>
<div class="box">
<h2>Create Account</h2>
<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">
<button onclick="signup()">Sign Up</button>
<p>Already have an account?</p>
<a href="login.html">Login</a>
</div>
<script type="module" src="firebase.js"></script>
</body>
</html>
