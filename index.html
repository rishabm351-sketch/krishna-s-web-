<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First Website</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Krishna Dixit</h1>
<img src="yuvii.png" alt="Profile Image" width="300">
<p><b>Date of Birth:</b> 4 November 2012</p>
<p>Ye meri pehli website hai. Aapka welcome hai ?</p>
<div class="clock-box">
<div id="clock"></div>
<div id="date"></div>
</div>
<button class="welcome-btn" onclick="welcomeMessage()">
Click Me
</button>
<div class="calculator">
<input type="text" id="display" readonly>
<div class="calc-buttons">
<button onclick="clearDisplay()">C</button>
<button onclick="appendValue('/')">÷</button>
<button onclick="appendValue('*')">×</button>
<button onclick="appendValue('-')">-</button>
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button onclick="appendValue('+')">+</button>
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button onclick="calculate()">=</button>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button onclick="appendValue('.')">.</button>
<button class="zero" onclick="appendValue('0')">0</button>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
